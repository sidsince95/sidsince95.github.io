---
layout: default
---
<article class="project-page post">

<a href="{{ '/blog/' | relative_url }}" class="back-link"><span class="back-chevron">&#8249;</span> Blog Posts</a>

<h1>{{ page.title }}</h1>

<p class="project-meta"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time></p>

<div class="post-body">
{{ content }}
</div>

<a href="{{ '/blog/' | relative_url }}" class="back-link back-link-bottom"><span class="back-chevron">&#8249;</span> Blog Posts</a>

</article>
{% if page.structured %}<script defer src="{{ '/assets/js/post-structure.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>{% endif %}
